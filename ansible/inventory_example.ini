[gitea_server]
GITEA_PUBLIC_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/terraform-key

[database_server]
DATABASE_PRIVATE_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/terraform-key ansible_ssh_common_args='-o ProxyCommand="ssh -i ~/.ssh/terraform-key -W %h:%p -o StrictHostKeyChecking=no ec2-user@GITEA_PUBLIC_IP" -o StrictHostKeyChecking=no'