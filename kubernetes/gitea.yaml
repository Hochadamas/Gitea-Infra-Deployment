apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-config
data:
  GITEA__database__DB_TYPE: postgres
  GITEA__database__HOST: postgres-service:5432
  GITEA__database__NAME: gitea
  GITEA__database__USER: gitea
  GITEA__security__INSTALL_LOCK: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ebs-gp3
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
      - name: gitea
        image: gitea/gitea:latest
        envFrom:
        - configMapRef:
            name: gitea-config
        env:
        - name: GITEA__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: gitea-data
          mountPath: /data
      volumes:
      - name: gitea-data
        persistentVolumeClaim:
          claimName: gitea-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-service
spec:
  selector:
    app: gitea
  ports:
    - port: 3000
      targetPort: 3000
